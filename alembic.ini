# Alembic configuration for the CompIQCoreBe project (JVRE backend).
#
# IMPORTANT: sqlalchemy.url is deliberately NOT set here.
# alembic/env.py loads it from app.core.config (which reads DATABASE_URL
# from the environment / .env file). This keeps credentials out of source
# control and ensures local, staging, and production all use the same
# configuration mechanism.

[alembic]
# Path to the migrations directory (relative to this file).
script_location = alembic

# Make `app` importable from inside env.py and migration scripts.
prepend_sys_path = .

# Template used when generating new migration filenames.
# Prefixing with a UTC timestamp keeps versions sortable.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Treat each path component as OS-native separators.
version_path_separator = os

# Timezone for timestamps in migration filenames (UTC is sane for teams).
timezone = UTC


# ---------------------------------------------------------------------------
# Post-write hooks: run Ruff on every generated migration file so output
# matches the rest of the codebase.
# ---------------------------------------------------------------------------
[post_write_hooks]
hooks = ruff_check, ruff_format

# Use `exec` (not `console_scripts`) because Ruff is a standalone Rust binary
# and doesn't register itself as a Python entry point.
ruff_check.type = exec
ruff_check.executable = ruff
ruff_check.options = check --fix --select I REVISION_SCRIPT_FILENAME

ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME


# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
