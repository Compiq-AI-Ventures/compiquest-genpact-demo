[project]
name = "compiqcorebe"
version = "0.1.0"
description = "Backend for JVRE (Job Value Recommendation Engine)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # IANA timezone database. Required on Windows because `zoneinfo` has no
    # built-in tzdata there (Linux/macOS use the system database).
    "tzdata>=2024.2",
    # --- Auth -----------------------------------------------------------
    # Password hashing. Pin bcrypt<4.1 because passlib 1.7.x can't read the
    # version metadata in newer bcrypt releases and emits a noisy warning.
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1",
    # JWT signing/verification (used later when login is wired up).
    "python-jose[cryptography]>=3.3.0",
    "email-validator>=2.2.0",
    # --- Observability / hardening --------------------------------------
    # Structured JSON logging with context-var propagation (request_id, etc.).
    "structlog>=24.4.0",
    # IP / key-based rate limiting. In-memory by default; Redis when
    # ``RATE_LIMIT_STORAGE_URI=redis://...`` is set.
    "slowapi>=0.1.9",
    # Async Redis client. Used by the JWT deny-list when
    # ``REDIS_URL`` is set; without it the deny-list falls back to an
    # in-process dict so single-instance deployments keep working.
    "redis>=5.0.0",
    "boto3>=1.43.26",
    "fpdf2>=2.8.7",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.9",
    "pypdf>=4.0.0",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    # Load testing harness. See loadtest/README.md.
    "locust>=2.31.0",
]

[project.scripts]
# ``uv run compiqcorebe <subcommand>`` after ``uv sync``.
compiqcorebe = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line-too-long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults (FastAPI uses Depends())
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101"]
# The CD&A report faithfully transcribes proxy-statement prose (curly quotes,
# em/en dashes) and maps those exact glyphs to Latin-1 — the "ambiguous
# unicode" characters are intentional there.
"app/services/cda/template.py" = ["RUF001", "RUF002", "RUF003"]
"app/services/cda/pdf_builder.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    # Bootstrap is wired up in main.py — exercising it requires a full
    # uvicorn boot, which the unit-test suite intentionally skips.
    "app/main.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
# Fail the run if coverage drops below this threshold. Start
# conservative; ratchet up as more tests land.
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "def __repr__",
    "\\.\\.\\.",
]
